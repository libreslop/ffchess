[package]
name = "loadtest"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
common = { path = "../common" }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
